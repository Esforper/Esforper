
# Regenerates the profile's live graphics once a day and publishes them to the
# `runtime` branch.
#
# Nothing here writes to main. README.md points at raw.githubusercontent URLs on
# `runtime`, so the visible profile updates without a single bot commit landing
# in the history you actually care about.
#
# `runtime` is rebuilt as an orphan branch and force-pushed, so it holds exactly
# one commit no matter how many years this runs.

name: runtime

on:
  schedule:
    # 05:17 UTC. Off the hour, because everyone's cron fires on the hour and
    # GitHub's scheduler queues behind the crowd.
    - cron: '17 5 * * *'
  workflow_dispatch:

# Only the branch push needs write access; nothing else here mutates the repo.
permissions:
  contents: write

concurrency:
  group: runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A fork inherits the workflow but not the owner's data or push rights.
    if: github.repository_owner == 'Esforper'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch live data
        env:
          # A PAT with read:user, if GITHUB_TOKEN is refused for the GraphQL
          # contributions query or you want private contributions counted.
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          node scripts/fetch-contributions.mjs
          node scripts/fetch-repos.mjs

      - name: Require live data
        # Without this the build would quietly fall back to the sample set and
        # publish a graph labelled SAMPLE DATA to the profile.
        run: |
          if [ ! -f data/contributions.json ]; then
            echo "::error::No contributions data was fetched. Add a CONTRIB_TOKEN secret (a PAT with read:user)."
            exit 1
          fi

      - name: Build SVGs
        run: node scripts/build.mjs boot workload agents snake

      - name: Read snake palette
        id: snk
        # The colours live in scripts/theme.mjs; the build writes them here so
        # the snake cannot drift out of palette with everything else.
        run: |
          {
            echo 'outputs<<SNK_EOF'
            cat assets/snk-outputs.txt
            echo 'SNK_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Draw contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: ${{ steps.snk.outputs.outputs }}

      - name: Publish to runtime branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp assets/*.svg "$staging/"

          cat > "$staging/README.md" <<'NOTE'
          # runtime

          Generated assets for the profile README. Rebuilt daily by
          `.github/workflows/runtime.yml` and force-pushed as a single commit.

          Do not edit or branch from this. The sources are on `main`.
          NOTE

          cd "$staging"
          git init -q -b runtime
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "runtime: assets for $(date -u +%Y-%m-%d)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" runtime

          echo "published $(ls -1 *.svg | wc -l) SVGs to the runtime branch"
